spring:
  datasource:
    url: jdbc:oracle:thin:@localhost:1521:free
    driver-class-name: oracle.jdbc.OracleDriver
    username: system
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.OracleDialect